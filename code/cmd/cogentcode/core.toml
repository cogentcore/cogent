Name = "Cogent Code"

# the types of files that Cogent Code opens, for the Open with choices of
# the systems: all source code and text files, and the text documents and
# data files (see cogentcore.org/core/base/fileinfo)
Opens = ["Code", "Text", "Markdown", "TeX", "BibTeX", "HTML", "CSS", "CSV", "TSV", "JSON", "XML", "YAML", "TOML", "INI", "Protobuf"]

# installed App makes a symlink into ~/go/bin version of app, so it is updated
# with a simple go install.
AppGoSymlink = true

