name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    env:
      # the FFmpeg version required by the go-astiav version of core (video)
      FFMPEG_VERSION: n9.0.2
      FFMPEG_PATH: /home/runner/ffmpeg
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.2'

    - name: Set up Core
      run: go install cogentcore.org/core@main && core setup

    # apt does not have the FFmpeg version that go-astiav requires, so it is
    # built from source, as in the CI of go-astiav and of core, and cached
    - name: Load FFmpeg cache
      id: ffmpeg-cache
      uses: actions/cache@v5
      with:
        path: ${{ env.FFMPEG_PATH }}
        key: ffmpeg-${{ env.FFMPEG_VERSION }}-${{ runner.os }}-${{ runner.arch }}

    - name: Build FFmpeg (video)
      if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
      run: |
        sudo apt-get install -y nasm
        git clone --depth 1 --branch "$FFMPEG_VERSION" https://github.com/FFmpeg/FFmpeg "$RUNNER_TEMP/ffmpeg-src"
        cd "$RUNNER_TEMP/ffmpeg-src"
        ./configure --prefix="$FFMPEG_PATH" --enable-shared --disable-static --disable-autodetect --disable-programs --disable-doc
        make -j"$(nproc)"
        make install

    - name: Set FFmpeg environment variables
      run: |
        echo "PKG_CONFIG_PATH=$FFMPEG_PATH/lib/pkgconfig" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=$FFMPEG_PATH/lib" >> $GITHUB_ENV
        sudo apt-get install -y libasound2-dev

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./... -coverprofile cover.out -timeout 30s

    - name: Update coverage report
      uses: cogentcore/goal-coverage-report@v0
      with:
        coverage-file: cover.out
      if: github.event_name == 'push'
