name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    env:
      # the FFmpeg version required by the go-astiav version of core (video)
      FFMPEG_VERSION: n9.0.2
      FFMPEG_PATH: /home/runner/ffmpeg
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.2'

    # the system packages (plus the audio dependencies of video), the core command,
    # and its Go tools (goimports, goalimports, goalls)
    - name: Set up Core
      uses: cogentcore/core/.github/actions/setup-core@main
      with:
        extra-packages: libasound2-dev
        tools: true

    # apt does not have the FFmpeg version that go-astiav requires, so it is
    # built from source, as in the CI of go-astiav and of core, and cached
    - name: Load FFmpeg cache
      id: ffmpeg-cache
      uses: actions/cache@v5
      with:
        path: ${{ env.FFMPEG_PATH }}
        key: ffmpeg-${{ env.FFMPEG_VERSION }}-${{ runner.os }}-${{ runner.arch }}

    - name: Build FFmpeg (video)
      if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
      run: |
        sudo apt-get install -y nasm
        git clone --depth 1 --branch "$FFMPEG_VERSION" https://github.com/FFmpeg/FFmpeg "$RUNNER_TEMP/ffmpeg-src"
        cd "$RUNNER_TEMP/ffmpeg-src"
        ./configure --prefix="$FFMPEG_PATH" --enable-shared --disable-static --disable-autodetect --disable-programs --disable-doc
        make -j"$(nproc)"
        make install

    - name: Set FFmpeg environment variables
      run: |
        echo "PKG_CONFIG_PATH=$FFMPEG_PATH/lib/pkgconfig" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$FFMPEG_PATH/lib" >> "$GITHUB_ENV"

    # the tests of the LSP client and the debugger of Cogent Code use gopls and delve
    - name: Install gopls and delve
      run: go install golang.org/x/tools/gopls@v0.24.0 && go install github.com/go-delve/delve/cmd/dlv@v1.27.2

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./... -coverprofile cover.out -timeout 10m

    - name: Update coverage report
      uses: cogentcore/goal-coverage-report@v0
      with:
        coverage-file: cover.out
      if: github.event_name == 'push'
